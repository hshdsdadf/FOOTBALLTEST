<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA / Safari Add to Homescreen tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pixel Game">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Dynamic Manifest Placeholder -->
    <link id="manifest-placeholder" rel="manifest" href="">

    <title>Pixel Game</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #050912;
            --navy-deep: #050B1C;
            --navy: #0B1938;
            --navy-panel: #0E2249;
            --blue-line: #1E4FA3;
            --blue-glow: #3FA9FF;
            --cyan: #5EEBFF;
            --gold: #FFC94A;
            --gold-deep: #B9770E;
            --magenta: #FF3D9A;
            --violet: #8B3EFF;
            --green: #35D46A;
        }

        body {
            font-family: 'Pixelify Sans', sans-serif;
            background-color: #000;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            image-rendering: pixelated;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            background-color: var(--navy-deep);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Screen glare overlay */
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0,0,0,0.16) 0px,
                rgba(0,0,0,0.16) 1px,
                rgba(0,0,0,0) 2px,
                rgba(0,0,0,0) 3px
            );
            mix-blend-mode: multiply;
            opacity: 0.5;
        }

        #landscape-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #03112E;
            color: white;
            z-index: 9999;
            text-align: center;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        @media (orientation: landscape) and (max-height: 600px) {
            #landscape-warning { display: flex; }
            #game-container { display: none; }
        }

        .pixel-corners {
            clip-path: polygon(
                0 4px, 4px 4px, 4px 0,
                calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px,
                100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%,
                4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px)
            );
        }
        
        .pixel-corners-sm {
            clip-path: polygon(
                0 2px, 2px 2px, 2px 0,
                calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px,
                100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%,
                2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px)
            );
        }

        .pixel-panel {
            background: linear-gradient(180deg, var(--navy-panel) 0%, var(--navy) 100%);
            border: 2px solid var(--blue-line);
            box-shadow: inset -2px -2px 0px 0px rgba(0,0,0,0.6),
                        inset 2px 2px 0px 0px rgba(120,180,255,0.25),
                        0 3px 0px 0px rgba(0,0,0,0.5);
        }

        /* Notched-corner panel background WITHOUT clip-path (clip-path + animated
           children makes browsers randomly drop the background). Two overlapping
           rectangles form the same stepped corners. */
        .notch { position:absolute; inset:0; pointer-events:none; z-index:-1; }
        .layer-fix { transform:translateZ(0); will-change:transform; isolation:isolate; }
        .notch::before, .notch::after {
            content:""; position:absolute; box-sizing:border-box;
            border:2px solid var(--bc, #1E4FA3);
        }
        .notch::before {
            inset:0 var(--n,4px); background:var(--fill); background-origin:border-box;
            box-shadow:var(--shA, none);
        }
        .notch::after {
            inset:var(--n,4px) 0; background:var(--fillB, var(--fill)); background-origin:border-box;
            border-top-width:0; border-bottom-width:0;
            box-shadow:var(--shB, none);
        }

        /* Two-tone card background lives on its own layer (see note in fix) */
        .card-bg {
            background: linear-gradient(to bottom, #0E2249 0, #0E2249 60%, #09152E 60%, #09152E 100%);
        }

        .pixel-btn {
            background: linear-gradient(180deg, #1A3A73 0%, #11244A 100%);
            border: 2px solid #060D1A;
            box-shadow: inset -2px -2px 0px 0px rgba(0,0,0,0.6), 
                        inset 2px 2px 0px 0px rgba(255,255,255,0.25);
            transition: transform 0.05s;
        }
        .pixel-btn:active {
            transform: scale(0.95);
            box-shadow: inset 2px 2px 0px 0px rgba(0,0,0,0.6), 
                        inset -2px -2px 0px 0px rgba(255,255,255,0.2);
        }

        .pixel-text {
            text-shadow:
                1px 0 0 #000, -1px 0 0 #000,
                0 1px 0 #000, 0 -1px 0 #000,
                2px 2px 0 rgba(0,0,0,0.55);
        }
        .pixel-text-thin {
            text-shadow: 0 2px 0 rgba(0,0,0,0.9);
        }

        svg.pixel-art {
            shape-rendering: crispEdges;
        }

        @keyframes shine {
            0% { transform: translateX(-150%) skewX(-15deg); }
            15% { transform: translateX(300%) skewX(-15deg); }
            100% { transform: translateX(300%) skewX(-15deg); }
        }
        .shine-layer {
            position: absolute;
            top: 0; left: -20%;
            width: 30%; height: 100%;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.45) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-15deg);
            animation: shine 3.2s infinite;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes glow-pulse {
            0%, 100% { filter: drop-shadow(0 0 2px rgba(94,235,255,0.15)); }
            50% { filter: drop-shadow(0 0 7px rgba(94,235,255,0.55)); }
        }
        .glow-pulse { animation: glow-pulse 2.6s ease-in-out infinite; }

        @keyframes gem-sparkle {
            0%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
            50% { opacity: 1; transform: scale(1) rotate(20deg); }
        }
        .gem-sparkle { animation: gem-sparkle 1.8s ease-in-out infinite; }

        @keyframes bar-stripes {
            0% { background-position: 0 0; }
            100% { background-position: 16px 0; }
        }
        .bar-stripes {
            background-image: repeating-linear-gradient(
                45deg,
                rgba(255,255,255,0.18) 0px, rgba(255,255,255,0.18) 4px,
                transparent 4px, transparent 8px
            );
            background-size: 16px 16px;
            animation: bar-stripes 0.7s linear infinite;
        }

        @keyframes float-y {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }
        .float-y { animation: float-y 2.2s ease-in-out infinite; }

        @keyframes icon-bob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(-1.5deg); }
        }
        .icon-bob-wrap {
            animation: icon-bob 3.2s ease-in-out infinite;
            transform-origin: 50% 90%;
            position: relative;
            z-index: 1;
        }
        
        @keyframes shadow-pulse {
            0%, 100% { transform: translateX(-50%) scaleX(1); opacity: 0.55; }
            50% { transform: translateX(-50%) scaleX(0.72); opacity: 0.3; }
        }
        .floor-shadow {
            position: absolute;
            bottom: 4px;
            left: 50%;
            width: 58%;
            height: 7px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 72%);
            border-radius: 50%;
            animation: shadow-pulse 3.2s ease-in-out infinite;
            z-index: 0;
        }

        /* Dynamic CSS Field View - Middle Only, Crisp & Detailed */
        .field-perspective {
            transform: translateY(-50px) perspective(600px) rotateX(45deg) scale(2.8);
            transform-origin: center 50%;
            image-rendering: pixelated;
        }
        
        .yard-segment {
            height: 100px;
            width: 100%;
            position: relative;
            border-bottom: 4px solid rgba(255,255,255,0.9);
            box-sizing: border-box;
        }
        
        /* The 50 Yard line gets a subtle distinct stripe */
        .yard-segment.fifty-line {
            border-bottom: 4px solid #FCD34D;
        }

        /* Vibrant grass colors */
        .yard-segment.light { background-color: #22C55E; }
        .yard-segment.dark { background-color: #16A34A; }

        .hash-column {
            position: absolute;
            top: 0; bottom: 0;
            width: 14px;
            background-image: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.9) 0px, 
                rgba(255,255,255,0.9) 4px,
                transparent 4px, 
                transparent 20px /* 100px / 5 yards = 20px per yard spacing */
            );
        }

        /* Authentic scattered pixel grass texture */
        .grass-texture {
            position: absolute;
            inset: 0;
            opacity: 0.85;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><path fill="%23000000" opacity="0.15" d="M4 4h2v2H4z M12 8h2v2h-2z M24 2h2v2h-2z M36 12h2v2h-2z M48 6h2v2h-2z M58 14h2v2h-2z M8 22h2v2H8z M20 18h2v2h-2z M32 26h2v2h-2z M44 20h2v2h-2z M54 28h2v2h-2z M2 38h2v2H2z M16 34h2v2h-2z M28 42h2v2h-2z M40 36h2v2h-2z M52 44h2v2h-2z M60 32h2v2h-2z M10 52h2v2h-2z M22 48h2v2h-2z M34 56h2v2h-2z M46 50h2v2h-2z M56 58h2v2h-2z M6 60h2v2H6z M26 62h2v2h-2z M42 60h2v2h-2z M14 2h2v2h-2z M22 8h2v2h-2z M38 4h2v2h-2z M46 16h2v2h-2z"/><path fill="%23ffffff" opacity="0.15" d="M8 2h2v2H8z M20 12h2v2h-2z M32 4h2v2h-2z M44 14h2v2h-2z M54 8h2v2h-2z M2 18h2v2H2z M16 28h2v2h-2z M28 22h2v2h-2z M40 30h2v2h-2z M52 24h2v2h-2z M62 20h2v2h-2z M12 38h2v2h-2z M24 44h2v2h-2z M36 34h2v2h-2z M48 42h2v2h-2z M58 36h2v2h-2z M6 50h2v2H6z M18 58h2v2h-2z M30 52h2v2h-2z M42 58h2v2h-2z M50 62h2v2h-2z M60 48h2v2h-2z M10 10h2v2h-2z M26 14h2v2h-2z M34 20h2v2h-2z M50 10h2v2h-2z"/></svg>');
            background-size: 64px 64px;
            mix-blend-mode: overlay;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="landscape-warning">
        <svg viewBox="0 0 24 24" class="w-16 h-16 mb-4 text-white" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
        <h1 class="text-2xl font-bold mb-2">Portrait Mode Only</h1>
        <p class="text-gray-400">Please rotate your device back to portrait to play.</p>
    </div>

    <div id="game-container">
        
        <!-- TOP BAR -->
        <div class="absolute top-0 left-0 w-full p-2 pt-3 flex flex-col gap-2 z-20">
            
            <!-- Row 1: Profile & Menu -->
            <div class="flex justify-between items-stretch w-full gap-2">
                
                <!-- Profile Section (Left) -->

                    <!-- Avatar Box -->
                    <div class="w-[50px] h-[50px] bg-gradient-to-b from-[#3B82F6] to-[#1D4ED8] pixel-corners-sm border-[2px] border-[#7DC4FF] relative flex justify-center items-end overflow-hidden shadow-[0_0_0_2px_#050B1C,0_2px_6px_rgba(0,0,0,0.6)] shrink-0">
                        <svg viewBox="0 0 16 16" class="w-full h-full pixel-art absolute bottom-0" preserveAspectRatio="xMidYMax meet">

                            <rect x="11" y="8" width="1" height="4" fill="#1E3A8A"/>
                            <rect x="6" y="2" width="1" height="1" fill="#3B82F6"/>
                            <rect x="5" y="3" width="1" height="2" fill="#3B82F6"/>
                            <rect x="4" y="5" width="1" height="2" fill="#3B82F6"/>
                            <rect x="7" y="2" width="2" height="6" fill="#FFFFFF"/>
                            <rect x="5" y="8" width="6" height="4" fill="#FDBA74"/>
                            <rect x="9" y="8" width="2" height="4" fill="#EA580C"/>
                            <rect x="5" y="11" width="6" height="1" fill="#EA580C"/>

                            <rect x="5" y="12" width="6" height="1" fill="#E2E8F0"/>
                            <rect x="6" y="10" width="1" height="3" fill="#94A3B8"/>
                            <rect x="9" y="10" width="1" height="3" fill="#94A3B8"/>

                        </svg>
                    </div>

                    <!-- Name and Division -->
                    <div class="flex flex-col justify-center ml-2.5">
                        <span class="text-white font-bold text-[17px] leading-tight tracking-wide pixel-text">Player</span>
                        <div class="flex items-center gap-1.5 mt-0.5">

                <!-- Menu Button (Right) -->

            </div>

            <!-- Row 2: Resources -->

                <!-- Trophies -->

                    <div class="flex items-center gap-1.5">
                        <svg viewBox="0 0 12 12" class="w-4 h-4 pixel-art drop-shadow-[0_1px_0_rgba(0,0,0,1)] float-y">

                            <rect x="3" y="2" width="2" height="3" fill="#FEF3C7"/>
                            <rect x="5" y="2" width="3" height="1" fill="#FEF3C7"/>
                            <rect x="2" y="3" width="1" height="3" fill="#FEF3C7"/>

                            <rect x="6" y="5" width="2" height="2" fill="#F59E0B"/>
                        </svg>
                        <span class="text-[#FFC94A] text-[13px] font-bold tracking-wider pixel-text-thin">3,000</span>
                    </div>
                    <button class="bg-gradient-to-b from-[#4ADE80] to-[#16A34A] border-b-[3px] border-[#14532D] w-[22px] h-[22px] pixel-corners-sm flex items-center justify-center active:translate-y-[3px] active:border-b-0 transition-all">
                        <svg viewBox="0 0 8 8" class="w-[10px] h-[10px] pixel-art drop-shadow-[0_1px_0_rgba(0,0,0,0.3)]">
                            <rect x="3" y="0" width="2" height="8" fill="#FFF"/>
                            <rect x="0" y="3" width="8" height="2" fill="#FFF"/>
                        </svg>
                    </button>
                </div>

                <!-- Gems -->
                <div class="layer-fix flex-[1.2] flex items-center justify-between pl-2 pr-1 h-9 relative overflow-visible">
                    <span class="notch" style="--fill:linear-gradient(180deg,#0E2249,#0B1938);--shA:inset -2px -2px 0 rgba(0,0,0,.6),inset 2px 2px 0 rgba(120,180,255,.25);--n:2px;"></span>
                    <div class="flex items-center gap-1.5 relative">

    <script>
    // Tap the football: it hops to a random spot on the field, spinning, and settles with a tiny bounce.
    (function () {
        const zone = document.getElementById('ball-zone');
        const ball = document.getElementById('ball');
        const body = document.getElementById('ball-body');
        const shadow = document.getElementById('ball-shadow');
        if (!zone || !ball || !body || !shadow) return;

        let x = 0, y = 0, rot = -8, busy = false;   // x/y = offset from resting spot at zone centre

        function draw(h, r) {
            ball.style.transform = 'translate(' + x + 'px,' + y + 'px)';
            body.style.transform = 'translateY(' + (-3 - h) + 'px) rotate(' + r + 'deg)';
            const k = 1 - Math.min(h / 100, 1) * 0.5;          // shadow shrinks + fades as ball rises
            shadow.style.transform = 'translateX(-45%) scale(' + k + ')';
            shadow.style.opacity = String(0.35 + 0.65 * k);
        }

        const GRASS = ['#86EFAC', '#4ADE80', '#22C55E', '#16A34A', '#15803D', '#78350F'];

        // Little pixel-y grass/dirt clippings kicked up from the turf
        function burst(cx, cy, count, power) {
            const ps = [];
            for (let i = 0; i < count; i++) {
                const size = Math.random() < 0.5 ? 3 : 4;
                const el = document.createElement('div');
                el.style.cssText = 'position:absolute;pointer-events:none;z-index:1;width:' + size + 'px;height:' + size + 'px;background:' +
                    GRASS[Math.floor(Math.random() * GRASS.length)] + ';left:0;top:0;';
                zone.appendChild(el);
                ps.push({
                    el: el, x: cx, y: cy,
                    vx: (Math.random() - 0.5) * 220 * power,
                    vy: -(70 + Math.random() * 130) * power,
                    life: 420 + Math.random() * 280
                });
            }
            const t0 = performance.now();
            let last = t0;
            (function frame(now) {
                const dt = Math.min((now - last) / 1000, 0.05);
                last = now;
                let alive = 0;
                ps.forEach(function (p) {
                    const age = now - t0;
                    if (age >= p.life) { if (p.el) { p.el.remove(); p.el = null; } return; }
                    alive++;
                    p.vy += 620 * dt;
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    if (p.y > cy + 4) { p.y = cy + 4; p.vy = 0; p.vx *= 0.6; }   // settle on the grass
                    p.el.style.transform = 'translate(' + Math.round(p.x) + 'px,' + Math.round(p.y) + 'px)';
                    p.el.style.opacity = age > p.life * 0.6 ? String(1 - (age - p.life * 0.6) / (p.life * 0.4)) : '1';
                });
                if (alive) requestAnimationFrame(frame);
            })(t0);
        }

        function run(duration, step, done) {
            const t0 = performance.now();
            (function frame(now) {
                const t = Math.min((now - t0) / duration, 1);
                step(t);
                if (t < 1) requestAnimationFrame(frame); else if (done) done();
            })(t0);
        }

        ball.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            if (busy) return;
            busy = true;

            const r = zone.getBoundingClientRect();
            const zw = r.width, zh = r.height;
            // keep the ball clear of the top bar, the left buttons and the bottom menu
            const minX = 100, maxX = Math.max(minX + 1, zw - 40);
            const minY = 150, maxY = Math.max(minY + 1, zh - 35);

            let tx, ty, tries = 0;
            do {
                tx = minX + Math.random() * (maxX - minX);
                ty = minY + Math.random() * (maxY - minY);
                tries++;
            } while (Math.hypot(tx - zw / 2 - x, ty - zh / 2 - y) < 60 && tries < 25);

            const x0 = x, y0 = y, x1 = tx - zw / 2, y1 = ty - zh / 2;
            burst(zw / 2 + x0, zh / 2 + y0 + 10, 12, 1.1);         // grass kicked up on tap
            const dist = Math.hypot(x1 - x0, y1 - y0);
            const H = Math.max(60, Math.min(120, 50 + dist * 0.3));       // jump height
            const dur = Math.max(600, Math.min(1000, 500 + dist * 1.2));   // hang time
            const spins = (Math.random() < 0.5 ? -1 : 1) * (1 + Math.floor(Math.random() * 2));
            const rEnd = Math.random() * 44 - 22;                          // final resting tilt
            const r0 = rot, r1 = spins * 360 + rEnd;

            run(dur, function (t) {
                x = x0 + (x1 - x0) * t;
                y = y0 + (y1 - y0) * t;
                const ease = 1 - Math.pow(1 - t, 2);
                draw(4 * H * t * (1 - t), r0 + (r1 - r0) * ease);
            }, function () {
                x = x1; y = y1; rot = rEnd;
                run(220, function (t) {                                    // little landing bounce
                    draw(4 * (H * 0.16) * t * (1 - t), rEnd + 7 * Math.sin(t * Math.PI));
                }, function () { draw(0, rEnd); busy = false; });
            });
        }, { passive: false });
    })();
    </script>
