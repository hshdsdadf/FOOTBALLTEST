<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA / Safari Add to Homescreen tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pixel Game">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Dynamic Manifest Placeholder -->
    <link id="manifest-placeholder" rel="manifest" href="">
 
    <title>Pixel Game</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap" rel="stylesheet">
 
    <style>
        :root {
            --ink: #050912;
            --navy-deep: #050B1C;
            --navy: #0B1938;
            --navy-panel: #0E2249;
            --blue-line: #1E4FA3;
            --blue-glow: #3FA9FF;
            --cyan: #5EEBFF;
            --gold: #FFC94A;
            --gold-deep: #B9770E;
            --magenta: #FF3D9A;
            --violet: #8B3EFF;
            --green: #35D46A;
        }
 
        /* Base pixel font for the whole game */
        body {
            font-family: 'Pixelify Sans', sans-serif;
            background-color: #000; /* Dark background outside the game area */
            margin: 0;
            padding: 0;
            touch-action: manipulation; /* Prevent double-tap zoom */
            -webkit-user-select: none;
            user-select: none;
            image-rendering: pixelated;
        }
 
        /* Mobile portrait container */
        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 480px; /* Constrain to mobile width on desktop */
            margin: 0 auto;
            background:
                radial-gradient(circle at 20% 0%, #123166 0%, transparent 55%),
                radial-gradient(circle at 100% 30%, #2A1155 0%, transparent 45%),
                linear-gradient(180deg, #071230 0%, #030A1C 60%, #020610 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
 
        /* Faint scanline overlay for CRT / retro screen texture */
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0,0,0,0.16) 0px,
                rgba(0,0,0,0.16) 1px,
                rgba(0,0,0,0) 2px,
                rgba(0,0,0,0) 3px
            );
            mix-blend-mode: multiply;
            opacity: 0.5;
        }
 
        /* Enforce portrait mode */
        #landscape-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #03112E;
            color: white;
            z-index: 9999;
            text-align: center;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
 
        @media (orientation: landscape) and (max-height: 600px) {
            #landscape-warning { display: flex; }
            #game-container { display: none; }
        }
 
        /* Hard pixel corner-notches: authentic 8-bit frame instead of rounded corners */
        .pixel-corners {
            clip-path: polygon(
                0 4px, 4px 4px, 4px 0,
                calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px,
                100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%,
                4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px)
            );
        }
        .pixel-corners-sm {
            clip-path: polygon(
                0 2px, 2px 2px, 2px 0,
                calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px,
                100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%,
                2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px)
            );
        }
 
        /* Chunky Pixel UI borders */
        .pixel-panel {
            background: linear-gradient(180deg, var(--navy-panel) 0%, var(--navy) 100%);
            border: 2px solid var(--blue-line);
            /* Inner 3D highlight/shadow effect typical in retro games */
            box-shadow: inset -2px -2px 0px 0px rgba(0,0,0,0.6),
                        inset 2px 2px 0px 0px rgba(120,180,255,0.25),
                        0 3px 0px 0px rgba(0,0,0,0.5);
        }
 
        .pixel-inner-panel {
            background-color: #060D1A;
            box-shadow: inset 2px 2px 0px 0px rgba(0,0,0,0.5), 
                        inset -1px -1px 0px 0px rgba(255,255,255,0.1);
        }
 
        .pixel-btn {
            background: linear-gradient(180deg, #1A3A73 0%, #11244A 100%);
            border: 2px solid #060D1A;
            box-shadow: inset -2px -2px 0px 0px rgba(0,0,0,0.6), 
                        inset 2px 2px 0px 0px rgba(255,255,255,0.25);
            transition: transform 0.05s;
        }
        .pixel-btn:active {
            transform: scale(0.95);
            box-shadow: inset 2px 2px 0px 0px rgba(0,0,0,0.6), 
                        inset -2px -2px 0px 0px rgba(255,255,255,0.2);
        }
 
        /* Punchy black-outline pixel text (crisper than blurry drop-shadows) */
        .pixel-text {
            text-shadow:
                1px 0 0 #000, -1px 0 0 #000,
                0 1px 0 #000, 0 -1px 0 #000,
                2px 2px 0 rgba(0,0,0,0.55);
        }
        .pixel-text-thin {
            text-shadow: 0 2px 0 rgba(0,0,0,0.9);
        }
 
        /* SVG pixel art crisp rendering */
        svg.pixel-art {
            shape-rendering: crispEdges;
        }
 
        /* Shine Animation for Season Banner */
        @keyframes shine {
            0% { transform: translateX(-150%) skewX(-15deg); }
            15% { transform: translateX(300%) skewX(-15deg); }
            100% { transform: translateX(300%) skewX(-15deg); }
        }
        .shine-layer {
            position: absolute;
            top: 0; left: -20%;
            width: 30%; height: 100%;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.45) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-15deg);
            animation: shine 3.2s infinite;
            z-index: 5;
            pointer-events: none;
        }
 
        /* Twinkling starfield */
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(0.8); }
            50% { opacity: 0.9; transform: scale(1.2); }
        }
        .star {
            animation: twinkle 2.4s ease-in-out infinite;
        }
 
        /* Slow ambient pulse for glowing card art */
        @keyframes glow-pulse {
            0%, 100% { filter: drop-shadow(0 0 2px rgba(94,235,255,0.15)); }
            50% { filter: drop-shadow(0 0 7px rgba(94,235,255,0.55)); }
        }
        .glow-pulse { animation: glow-pulse 2.6s ease-in-out infinite; }
 
        @keyframes gem-sparkle {
            0%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
            50% { opacity: 1; transform: scale(1) rotate(20deg); }
        }
        .gem-sparkle { animation: gem-sparkle 1.8s ease-in-out infinite; }
 
        /* Striped animated fill for progress bar */
        @keyframes bar-stripes {
            0% { background-position: 0 0; }
            100% { background-position: 16px 0; }
        }
        .bar-stripes {
            background-image: repeating-linear-gradient(
                45deg,
                rgba(255,255,255,0.18) 0px, rgba(255,255,255,0.18) 4px,
                transparent 4px, transparent 8px
            );
            background-size: 16px 16px;
            animation: bar-stripes 0.7s linear infinite;
        }
 
        @keyframes float-y {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }
        .float-y { animation: float-y 2.2s ease-in-out infinite; }
 
        /* Subtle idle "living toy" bob for 3D nav icons, paired with a squashing floor shadow */
        @keyframes icon-bob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(-1.5deg); }
        }
        .icon-bob-wrap {
            animation: icon-bob 3.2s ease-in-out infinite;
            transform-origin: 50% 90%;
            position: relative;
            z-index: 1;
        }
        @keyframes shadow-pulse {
            0%, 100% { transform: translateX(-50%) scaleX(1); opacity: 0.55; }
            50% { transform: translateX(-50%) scaleX(0.72); opacity: 0.3; }
        }
        .floor-shadow {
            position: absolute;
            bottom: 4px;
            left: 50%;
            width: 58%;
            height: 7px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 72%);
            border-radius: 50%;
            animation: shadow-pulse 3.2s ease-in-out infinite;
            z-index: 0;
        }
    </style>
</head>
<body>
 
    <div id="landscape-warning">
        <svg viewBox="0 0 24 24" class="w-16 h-16 mb-4 text-white" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                            <rect x="4" y="2" width="8" height="14" fill="#020617"/>

                            <!-- Eyes -->

                            <rect x="8" y="9" width="1" height="1" fill="#020617"/>

                            <rect x="3" y="7" width="6" height="1" fill="#F59E0B"/>

        <!-- Game Content Area and Bottom Menu -->
