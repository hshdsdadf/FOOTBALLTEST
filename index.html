<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>Retro Football Game - Polished Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            background-color: #0f172a; 
            overflow: hidden; 
            display: flex; justify-content: center; align-items: center;
            touch-action: none; /* Prevents pull-to-refresh and zooming */
            -webkit-user-select: none; /* Prevents text highlighting on rapid tapping */
            user-select: none;
            -webkit-touch-callout: none;
        }

        canvas {
            display: block;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            z-index: 1;
        }

        /* Subtle CRT Scanline Overlay */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
            z-index: 50; pointer-events: none; opacity: 0.6;
        }

        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: none; font-family: 'Press Start 2P', monospace; color: white; text-align: center; text-shadow: 4px 4px 0px #000;
        }

        .ui-panel {
            background-color: rgba(15, 23, 42, 0.95);
            border: 4px solid #ffffff; padding: 40px; pointer-events: auto; 
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.8);
            position: relative; overflow: hidden;
        }

        /* Add a tactical clipboard look to menus */
        .ui-panel::before {
            content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 60px; height: 20px; background: #94a3b8; border: 4px solid #fff; border-radius: 10px;
        }

        .retro-btn {
            background-color: #2563eb; color: white; border: 4px solid #ffffff; padding: 15px 30px;
            font-family: 'Press Start 2P', monospace; font-size: 16px; cursor: pointer; transition: all 0.1s;
            text-shadow: 2px 2px 0px #000; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.4), 4px 4px 0 rgba(0,0,0,0.8);
        }

        .retro-btn:hover { background-color: #3b82f6; transform: translateY(-2px); box-shadow: inset 0 -4px 0 rgba(0,0,0,0.4), 6px 6px 0 rgba(0,0,0,0.8); }
        .retro-btn:active { transform: translateY(2px); box-shadow: inset 0 0px 0 rgba(0,0,0,0.4), 0px 0px 0 rgba(0,0,0,0.8); }

        .retro-coin {
            width: 80px; height: 80px; background: radial-gradient(circle, #fde047 0%, #eab308 60%, #a16207 100%);
            border: 4px solid #4d2c0b; border-radius: 50%; margin: 20px 0; animation: coinFlip 0.4s infinite linear;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.8), 0 10px 0px rgba(0,0,0,0.6); position: relative; transform-style: preserve-3d;
        }
        
        .retro-coin::after {
            content: '$'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #4d2c0b; font-size: 40px; text-shadow: none;
        }

        @keyframes coinFlip { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }

        .playbook-svg { background-color: #0f661e; border: 4px solid #ffffff; box-shadow: 6px 6px 0px rgba(0,0,0,0.8); image-rendering: pixelated; }
        .playbook-svg rect, .playbook-svg line, .playbook-svg polyline, .playbook-svg path { shape-rendering: crispEdges; }
        .route-path { stroke: #ff003c; stroke-width: 4; fill: none; }
        
        .playbook-svg { width: 140px; height: 140px; background-color: #0f661e; border: 4px solid #ffffff; box-shadow: 6px 6px 0px rgba(0,0,0,0.8); image-rendering: pixelated; }

        @media (max-width: 768px) {
            .playbook-svg { width: 80px; height: 80px; }
            .play-card { padding: 10px; gap: 8px; }
            .play-title { font-size: 11px; }
            .ui-panel { padding: 15px; width: 95%; max-width: 100%; gap: 10px; }
            .ui-panel h2 { font-size: 18px !important; }
            .retro-btn { padding: 10px 15px; font-size: 12px; }
        }

        .hud-text {
            position: absolute; top: 90px; left: 50%; transform: translateX(-50%); width: 100%;
            text-align: center; font-family: 'Press Start 2P', monospace; color: white; font-size: 20px; text-shadow: 2px 2px 0 #000; z-index: 9; transition: transform 0.1s;
        }

        #scoreboard {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 8;
            display: flex; align-items: stretch; font-family: 'Press Start 2P', monospace; background-color: rgba(10, 15, 25, 0.95);
            border: 4px solid #ffffff; box-shadow: 6px 6px 0px rgba(0,0,0,0.8); border-radius: 4px; overflow: hidden; user-select: none;
        }

        #scoreboard .sb-team { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
        #scoreboard .sb-team.you { background-color: rgba(59, 130, 246, 0.3); }
        #scoreboard .sb-team.cpu { background-color: rgba(239, 68, 68, 0.3); }

        #scoreboard .sb-label { font-size: 12px; color: #cbd5e1; }
        #scoreboard .sb-score { font-size: 20px; color: #ffffff; min-width: 24px; text-align: center; }

        #scoreboard .sb-possession {
            width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 12px solid #facc15;
            opacity: 0; transition: opacity 0.15s; flex-shrink: 0; filter: drop-shadow(2px 2px 0 #000);
        }

        #scoreboard .sb-possession.show { opacity: 1; animation: pulsePoss 1s infinite; }
        #scoreboard .sb-possession.flip { border-left: none; border-right: 12px solid #facc15; }

        @keyframes pulsePoss { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

        #scoreboard .sb-center {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 8px 20px; border-left: 4px solid #fff; border-right: 4px solid #fff; background-color: rgba(255,255,255,0.1);
        }

        #scoreboard .sb-quarter { font-size: 12px; color: #facc15; margin-bottom: 6px; text-shadow: 2px 2px 0 #000; }
        #scoreboard .sb-clock { font-size: 16px; color: #4ade80; text-shadow: 2px 2px 0 #000; }
        #scoreboard .sb-clock.low { color: #f87171; animation: flashClock 0.5s infinite; }
        @keyframes flashClock { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        #play-clock {
            position: absolute; top: 85px; left: 50%; transform: translateX(-50%); z-index: 9;
            display: none; flex-direction: column; align-items: center; font-family: 'Press Start 2P', monospace; background-color: rgba(10, 15, 25, 0.9);
            border: 3px solid #facc15; border-radius: 4px; padding: 6px 14px; box-shadow: 4px 4px 0px rgba(0,0,0,0.8);
        }

        #play-clock.show { display: flex; }
        #play-clock .pc-label { font-size: 9px; color: #facc15; letter-spacing: 1px; margin-bottom: 4px; }
        #play-clock .pc-value { font-size: 18px; color: #4ade80; }
        #play-clock .pc-value.low { color: #f87171; animation: flashClock 0.25s infinite; }

        #down-distance {
            position: absolute; top: 85px; left: 50%; transform: translateX(-50%); z-index: 9;
            display: none; font-family: 'Press Start 2P', monospace; font-size: 14px; color: #facc15; letter-spacing: 1px; background-color: rgba(10, 15, 25, 0.9);
            border: 3px solid #facc15; border-radius: 4px; padding: 8px 16px; box-shadow: 4px 4px 0px rgba(0,0,0,0.8); white-space: nowrap;
        }

        #down-distance.show { display: block; }
        #play-clock.show ~ #down-distance { top: 135px; }

        .play-card {
            background-color: #1e293b; border: 4px solid #ffffff; padding: 15px; cursor: pointer; transition: transform 0.1s, border-color 0.1s;
            display: flex; flex-direction: column; align-items: center; gap: 15px; box-shadow: 6px 6px 0px rgba(0,0,0,0.8); position: relative;
        }
        .play-card:hover { transform: translateY(-5px); border-color: #facc15; box-shadow: 6px 11px 0px rgba(0,0,0,0.8); }
        .play-card:active { transform: translateY(0); box-shadow: 0px 0px 0px rgba(0,0,0,0.8); }
        .play-title { font-family: 'Press Start 2P', monospace; font-size: 14px; color: white; text-shadow: 2px 2px 0px #000; }

        .playcall-grid { display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 10px; max-width: 600px; }
        .playcall-special { display: flex; gap: 20px; margin-top: 20px; }

        @media (max-width: 768px) {
            .playbook-svg { width: 45px; height: 45px; border-width: 2px; }
            .play-card { padding: 4px; gap: 4px; border-width: 2px; box-shadow: 2px 2px 0px rgba(0,0,0,0.8); border-radius: 4px; }
            .play-title { font-size: 8px; }
            .ui-panel { padding: 12px; width: 92%; max-width: 100%; gap: 8px; border-radius: 8px; }
            .ui-panel h2 { font-size: 14px !important; margin-bottom: 2px !important; }
            .ui-panel p { font-size: 10px !important; margin-bottom: 4px !important; }
            .retro-btn { padding: 8px 12px; font-size: 10px; border-width: 2px; }
            .playcall-grid { gap: 10px; margin-top: 5px; }
            .playcall-special { gap: 10px; margin-top: 10px; }
        }

        @media (max-height: 500px) {
            .ui-panel { padding: 8px; gap: 4px; }
            .playbook-svg { width: 40px; height: 40px; }
            .playcall-grid { gap: 8px; margin-top: 4px; }
            .play-card { padding: 3px; gap: 3px; }
        }

        #td-banner {
            position: absolute; top: 32%; left: 50%; transform: translate(-50%, -50%) scale(0.3); z-index: 20; text-align: center; font-family: 'Press Start 2P', monospace; pointer-events: none; opacity: 0;
        }
        #td-banner.show { animation: tdPopIn 0.6s cubic-bezier(.2,1.6,.4,1) forwards; }
        #td-banner.hide { animation: tdPopOut 0.4s ease-in forwards; }
        #td-banner .td-main {
            font-size: 72px; color: #facc15; -webkit-text-stroke: 4px #000; text-shadow: 6px 6px 0px #b91c1c, 10px 10px 0px rgba(0,0,0,0.6);
            letter-spacing: 2px; animation: tdPulse 0.5s ease-in-out infinite; white-space: nowrap; font-style: italic;
        }
        #td-banner .td-sub { margin-top: 20px; font-size: 26px; color: #ffffff; text-shadow: 4px 4px 0px #000; animation: tdFadeUp 0.5s ease-out 0.4s both; background: rgba(0,0,0,0.5); display: inline-block; padding: 10px 20px; border: 3px solid #fff; }

        @keyframes tdPopIn {
            0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.2) rotate(-10deg); }
            60%  { opacity: 1; transform: translate(-50%, -50%) scale(1.2) rotate(5deg); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }
        @keyframes tdPopOut { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } }
        @keyframes tdPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes tdFadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }

        #penalty-toast {
            position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%) scale(0.5); z-index: 25; font-family: 'Press Start 2P', monospace; font-size: 20px;
            color: #fb923c; text-shadow: 3px 3px 0px #000; background: rgba(15, 23, 42, 0.95); border: 4px solid #fb923c; padding: 16px 24px; opacity: 0; pointer-events: none; white-space: nowrap; box-shadow: 6px 6px 0 rgba(0,0,0,0.8);
        }
        #penalty-toast.show { animation: toastPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        #penalty-toast.hide { animation: toastFade 0.3s ease-in forwards; }

        @keyframes toastPop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        @keyframes toastFade { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); } }

        #dialog-box {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 700px; background-color: rgba(15, 23, 42, 0.95);
            border: 4px solid #ffffff; padding: 20px; z-index: 1000;
            display: none; align-items: stretch; gap: 20px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.8); cursor: pointer;
        }
        #dialog-avatar {
            width: 100px; height: 100px; border: 4px solid #fff; flex-shrink: 0; background: #94a3b8;
        }
        #dialog-content {
            display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1;
        }
        #dialog-name {
            font-family: 'Press Start 2P', monospace; font-size: 18px; color: #facc15;
            text-shadow: 2px 2px 0px #000; margin-bottom: 12px;
        }
        #dialog-text {
            font-family: 'Press Start 2P', monospace; font-size: 16px; color: white; line-height: 1.5;
            text-shadow: 2px 2px 0px #000;
        }
        #dialog-prompt {
            font-family: 'Press Start 2P', monospace; font-size: 12px; color: #facc15;
            text-align: right; text-shadow: 2px 2px 0px #000; margin-top: 10px;
            animation: flashClock 1s infinite; display: none;
        }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2000; pointer-events: none; /* Let touches pass through to canvas for aiming */
            display: flex; justify-content: space-between; align-items: flex-end;
            padding-left: max(30px, env(safe-area-inset-left));
            padding-right: max(30px, env(safe-area-inset-right));
            padding-bottom: max(30px, env(safe-area-inset-bottom));
            transition: opacity 0.2s ease;
        }

        #joystick-zone {
            width: 150px; height: 150px; background: rgba(255, 255, 255, 0.05);
            border: 4px solid rgba(255, 255, 255, 0.2); border-radius: 50%;
            position: relative; pointer-events: auto; display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5); margin-bottom: 20px;
        }

        #joystick-knob {
            width: 60px; height: 60px; background: rgba(255, 255, 255, 0.6);
            border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            pointer-events: none; /* Let the zone handle touches */
            transition: transform 0.05s linear;
        }

        #action-btn {
            width: 100px; height: 100px; background: rgba(239, 68, 68, 0.6);
            border: 4px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
            pointer-events: auto; display: flex; justify-content: center; align-items: center;
            font-family: 'Press Start 2P', monospace; color: white; font-size: 16px;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.4), 0 4px 10px rgba(0,0,0,0.5);
            text-shadow: 2px 2px 0 #000; margin-bottom: 30px;
        }
        
        #action-btn:active, #action-btn.active-touch {
            transform: translateY(4px);
            box-shadow: inset 0 0px 0 rgba(0,0,0,0.4), 0 0px 0 rgba(0,0,0,0.5);
            background: rgba(239, 68, 68, 0.9);
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div id="ui-container" class="ui-layer"></div>
    
    <div id="td-banner">
        <div class="td-main" id="td-banner-main">TOUCHDOWN!!</div>
        <div class="td-sub" id="td-banner-sub">YOU SCORE! +6</div>
    </div>
    <div id="penalty-toast">DELAY OF GAME! -5 YARDS</div>

    <div id="dialog-box" onclick="advanceDialog()">
        <div id="dialog-avatar"></div>
        <div id="dialog-content">
            <div id="dialog-name">HEAD COACH</div>
            <div id="dialog-text"></div>
            <div id="dialog-prompt">TAP HERE TO CONTINUE</div>
        </div>
    </div>
    
    <div id="intro-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; z-index: 999; transition: opacity 1s ease-in-out;"></div>
    
    <div id="hud" class="hud-text"></div>
    <div id="play-clock"><div class="pc-label">PLAY CLOCK</div><div class="pc-value" id="pc-value">15</div></div>
    <div id="down-distance">1ST &amp; 10</div>
    
    <div id="scoreboard">
        <div class="sb-team you">
            <div class="sb-possession" id="sb-poss-you"></div>
            <div class="sb-label">YOU</div>
            <div class="sb-score" id="sb-score-you">0</div>
        </div>
        <div class="sb-center">
            <div class="sb-quarter" id="sb-quarter">Q1</div>
            <div class="sb-clock" id="sb-clock">3:00</div>
        </div>
        <div class="sb-team cpu">
            <div class="sb-score" id="sb-score-cpu">0</div>
            <div class="sb-label">CPU</div>
            <div class="sb-possession flip" id="sb-poss-cpu"></div>
        </div>
    </div>

    <div id="mobile-controls">
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
        <div id="action-btn">ACT</div>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiContainer = document.getElementById('ui-container');
        const hud = document.getElementById('hud');
        const sbScoreYou = document.getElementById('sb-score-you');
        const sbScoreCpu = document.getElementById('sb-score-cpu');
        const sbQuarter = document.getElementById('sb-quarter');
        const sbClock = document.getElementById('sb-clock');
        const sbPossYou = document.getElementById('sb-poss-you');
        const sbPossCpu = document.getElementById('sb-poss-cpu');
        const downDistanceEl = document.getElementById('down-distance');
        const playClockEl = document.getElementById('play-clock');
        const pcValue = document.getElementById('pc-value');
        const tdBanner = document.getElementById('td-banner');
        const tdBannerMain = document.getElementById('td-banner-main');
        const tdBannerSub = document.getElementById('td-banner-sub');
        const penaltyToast = document.getElementById('penalty-toast');

        // Mobile Controls setup
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        const actionBtn = document.getElementById('action-btn');
        let joystick = { active: false, origX: 0, origY: 0, dx: 0, dy: 0, normX: 0, normY: 0 };

        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation();
            joystick.active = true;
            let touch = e.changedTouches[0];
            let rect = joystickZone.getBoundingClientRect();
            joystick.origX = rect.left + rect.width / 2;
            joystick.origY = rect.top + rect.height / 2;
            updateJoystick(touch.clientX, touch.clientY);
        }, {passive: false});

        joystickZone.addEventListener('touchmove', (e) => {
            if(!joystick.active) return;
            e.preventDefault(); e.stopPropagation();
            updateJoystick(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        }, {passive: false});

        const resetJoystick = (e) => {
            if(e) { e.preventDefault(); e.stopPropagation(); }
            joystick.active = false; joystick.dx = 0; joystick.dy = 0; joystick.normX = 0; joystick.normY = 0;
            joystickKnob.style.transform = `translate(0px, 0px)`;
        };
        joystickZone.addEventListener('touchend', resetJoystick);
        joystickZone.addEventListener('touchcancel', resetJoystick);

        function updateJoystick(clientX, clientY) {
            let dx = clientX - joystick.origX;
            let dy = clientY - joystick.origY;
            let maxDist = 45; // Max knob travel radius inside the base
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxDist) { dx = (dx/dist) * maxDist; dy = (dy/dist) * maxDist; }
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joystick.dx = dx; joystick.dy = dy;
            joystick.normX = dx / maxDist; joystick.normY = dy / maxDist;
        }

        const handleActionDown = (e) => {
            if(e) { e.preventDefault(); e.stopPropagation(); }
            keys['Space'] = true; keys['KeyA'] = true;
            actionBtn.classList.add('active-touch');
        };
        const handleActionUp = (e) => {
            if(e) { e.preventDefault(); e.stopPropagation(); }
            keys['Space'] = false; keys['KeyA'] = false;
            actionBtn.classList.remove('active-touch');
        };
        actionBtn.addEventListener('touchstart', handleActionDown, {passive: false});
        actionBtn.addEventListener('touchend', handleActionUp);
        actionBtn.addEventListener('touchcancel', handleActionUp);

        // Textures
        let grassPattern, ez1Pattern, ez2Pattern;
        
        function initTextures() {
            // Enhanced grass with slight noise for texture
            const p1 = document.createElement('canvas');
            p1.width = 128; p1.height = 128;
            const ctx1 = p1.getContext('2d');
            for(let x=0; x<128; x+=8) {
                for(let y=0; y<128; y+=8) {
                    if(Math.random() < 0.4) {
                        ctx1.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.08)';
                        ctx1.fillRect(x + Math.floor(Math.random()*2)*4, y + Math.floor(Math.random()*2)*4, 4, 4);
                    }
                }
            }
            grassPattern = ctx.createPattern(p1, 'repeat');
            
            const p2 = document.createElement('canvas');
            p2.width = 32; p2.height = 32;
            const ctx2 = p2.getContext('2d');
            ctx2.fillStyle = '#1e3a8a'; ctx2.fillRect(0,0,32,32);
            ctx2.fillStyle = '#1e40af'; ctx2.fillRect(0,0,16,16); ctx2.fillRect(16,16,16,16);
            ez1Pattern = ctx.createPattern(p2, 'repeat');
            
            const p3 = document.createElement('canvas');
            p3.width = 32; p3.height = 32;
            const ctx3 = p3.getContext('2d');
            ctx3.fillStyle = '#b91c1c'; ctx3.fillRect(0,0,32,32);
            ctx3.fillStyle = '#dc2626'; ctx3.fillRect(0,0,16,16); ctx3.fillRect(16,16,16,16);
            ez2Pattern = ctx.createPattern(p3, 'repeat');
        }

        function showTouchdownBanner(scoredByCpu) {

            return gameState === 'PLAYING' && offenseDirection === -1 && isPassPlay(selectedPlay)

        function screenToWorldGround(sx, sy) {
            const renderCenterY = canvas.height * 0.6;
            let worldDy = (sy - renderCenterY) / (camera.zoom * camera.pitch);
            let y = camera.currentY + worldDy;
            let dx = (sx - canvas.width / 2) - (worldDy * camera.zoom * camera.skew);
            let x = camera.currentX + dx / (camera.zoom * X_STRETCH);
            return { x, y };
        }

        function updatePassProjection() {
            let dx = aimStartX - aimCurrentX; let dy = aimStartY - aimCurrentY;
            let qbScreen = toScreen(player.x, player.y);
            let targetScreenX = qbScreen.x + (dx * 3.5); let targetScreenY = qbScreen.y + (dy * 3.5);
            let worldPos = screenToWorldGround(targetScreenX, targetScreenY);
            
            projectedDestX = Math.max(-5, Math.min(FIELD_LENGTH_YARDS + 5, worldPos.x));
            projectedDestY = Math.max(-(FIELD_WIDTH_YARDS/2) - 5, Math.min((FIELD_WIDTH_YARDS/2) + 5, worldPos.y));
            
            let actualDist = Math.sqrt(Math.pow(projectedDestX - player.x, 2) + Math.pow(projectedDestY - player.y, 2));
            projectedHangTime = Math.max(45, actualDist * 2.5);
        }

        function executePass() {
            if (gameState !== 'PLAYING') return; 
            let qb = players.find(p => p.hasBall); if (!qb) return;
            
            let dragDist = Math.sqrt(Math.pow(aimStartX - aimCurrentX, 2) + Math.pow(aimStartY - aimCurrentY, 2));
            if (dragDist < 15) return; 

            qb.hasBall = false; ball.isBadPass = false;
            ball.destX = projectedDestX; ball.destY = projectedDestY;
            let hangTime = projectedHangTime;

            ball.vx = (ball.destX - ball.x) / hangTime; ball.vy = (ball.destY - ball.y) / hangTime;
            let z0 = 1.2; let zTarget = 1.0; let g = 0.008; 
            ball.vz = ((zTarget - z0) / hangTime) + (g * hangTime / 2) + (g / 2);

            let eligible = players.filter(p => !p.isCPU && !p.isLineman && !p.isQB);
            let bestWR = null; let minLeadTime = Infinity;

                if (distToSpot < minLeadTime) { minLeadTime = distToSpot; bestWR = wr; }
            });
            
            if (bestWR) {
                players.forEach(p => { p.isTargetReceiver = false; p.isIntercepter = false; });
                bestWR.isTargetReceiver = true;
                let COVERAGE_RADIUS = 3.2;
                players.filter(p => p.isCPU && !p.isLineman && !p.isQB).forEach(def => {
                    let dDist = Math.sqrt(Math.pow(def.x - ball.destX, 2) + Math.pow(def.y - ball.destY, 2));
                    if (dDist < COVERAGE_RADIUS) def.isIntercepter = true;
                });
            }
        }

    function generateSimulatedScores() {
        let teams = [...FRANCHISE_TEAMS].sort(() => 0.5 - Math.random());
        let results = [];
        for(let i=0; i<teams.length; i+=2) {
            if(i+1 >= teams.length) break;
            let t1 = teams[i]; let t2 = teams[i+1];
            
            // Generate a somewhat realistic football score weighted by their Overall Rating
            let t1Score = Math.max(0, Math.round(((t1.ratings.ovr / 3) + (Math.random() * 14) - 7) / 3) * 3 + (Math.random()>0.5?1:0)*4);
            let t2Score = Math.max(0, Math.round(((t2.ratings.ovr / 3) + (Math.random() * 14) - 7) / 3) * 3 + (Math.random()>0.5?1:0)*4);
            if(t1Score === t2Score) t1Score += 3; // Break ties easily
            
            results.push(`${t1.name.toUpperCase()} ${t1Score} - ${t2Score} ${t2.name.toUpperCase()}`);
        }
        return results.join('  +++  ');
    }

        function update() {
            updateScreenShake(); updateParticles();
            if (hitStopTimer > 0) { hitStopTimer--; return; }

            let hideControls = gameState === 'DIALOG' || gameState === 'PLAY_CALL' || gameState === 'COIN_TOSS' || 
                               gameState === 'KICK_CHOICE' || gameState === 'FLIPPING' || gameState === 'GAME_OVER' || 
                               (isIntroScene && introScriptState !== 'SCRIPTED_RUN' && introScriptState !== 'PRE_SNAP_WAIT');
                               
            let mc = document.getElementById('mobile-controls');
            if (hideControls) {
                if (mc.style.opacity !== '0') {
                    mc.style.opacity = '0';
                    mc.style.pointerEvents = 'none';
                    resetJoystick();
                    handleActionUp();
                }
            } else {
                if (mc.style.opacity !== '1') {
                    mc.style.opacity = '1';
                    mc.style.pointerEvents = 'auto';
                }
            }

            if (gameState === 'DIALOG') {
                if (keys['Space']) {
                    if (!spacePressed) {
                        spacePressed = true;
                        advanceDialog();
                    }
                } else spacePressed = false;
                return; // Freeze the game world while dialog is active
            }

            // Camera movement smoothing logic
            camera.currentX += (camera.x - camera.currentX) * 0.2;
            camera.currentY += (camera.y - camera.currentY) * 0.2;

            // Scripted intro sequence timer
            if (isIntroScene) {
                if (introScriptState === 'PRE_SNAP_WAIT') {
                    introTimer--;
                    if (introTimer <= 0) {
                        snapBall();
                        introScriptState = 'SCRIPTED_RUN';
                    }
                } else if (introScriptState === 'HEADSET_PAN_DOWN') {
                    introTimer--;
                    if (introTimer <= 0) {
                        introScriptState = 'HEADSET_PROMPT';
                        hud.innerHTML = `<div style="color: #4ade80; font-size: 20px; animation: pulsePoss 1s infinite; text-shadow: 3px 3px 0 #000; background: rgba(10, 15, 25, 0.9); padding: 12px 20px; border: 3px solid #4ade80; border-radius: 4px; display: inline-block;">[TAP SCREEN TO PICK UP]</div>`;
                    }
                }
            }

            let isMinigameActive = (gameState === 'INTERCEPTION_MINIGAME' || gameState === 'INTERCEPTION_RESULT');

            if (mainClockStarted && gameClock > 0 && !isMinigameActive) {
                gameClock -= 1 / 60; if (gameClock <= 0) gameClock = 0;
            }

            let isPlayerOffenseNow = offenseDirection === -1;
            if (isPlayerOffenseNow && (gameState === 'PLAY_CALL' || gameState === 'PRE_SNAP') && !isIntroScene) {
                playClockEl.classList.add('show');
                if (playClock > 0) {
                    playClock -= 1 / 60;
                    if (playClock <= 0) { playClock = 0; applyDelayOfGamePenalty(); selectedPlay = null; setupScrimmage(); }
                }
                pcValue.textContent = Math.ceil(playClock); pcValue.classList.toggle('low', playClock <= 5);
            } else { playClockEl.classList.remove('show'); }

            if (gameState === 'INTERCEPTION_MINIGAME') {
                intMinigame.ringRadius -= 1.35; 
                if (keys['Space']) {
                    if (!spacePressed) {
                        spacePressed = true;
                        let diff = Math.abs(intMinigame.ringRadius - intMinigame.targetRadius);
                        if (diff <= intMinigame.tolerance) intMinigame.result = 'success';
                        else if (intMinigame.ringRadius > intMinigame.targetRadius) intMinigame.result = 'fail_early';
                        else intMinigame.result = 'fail_late';
                        resolveInterceptionMinigame();
                    }
                } else spacePressed = false;
                if (intMinigame.ringRadius < intMinigame.targetRadius - intMinigame.tolerance && gameState === 'INTERCEPTION_MINIGAME') { intMinigame.result = 'fail_timeout'; resolveInterceptionMinigame(); }
            } else if (gameState === 'INTERCEPTION_RESULT') {
                intMinigame.timer++; if (intMinigame.timer > 45) finishInterceptionMinigame();
                if (keys['Space']) spacePressed = true; else spacePressed = false;
            } else {
                if (keys['Space']) {
                    if (!spacePressed) {
                        spacePressed = true;
                        
                        let canSnap = true;
                        if (isIntroScene) canSnap = false; // Block manual snap during intro
                        
                        if (gameState === 'PRE_SNAP' && offenseDirection === -1 && canSnap) { snapBall(); }
                        else if (gameState === 'KICK_POWER') {
                            gameState = 'KICK_DIR'; dirValue = 0; dirDelta = isFieldGoalPlay ? 0.024 : 0.022; 
                            if (isFieldGoalPlay && meterValue >= 85) { let kicker = players.find(p => p.isKicker); if (kicker) spawnImpactBurst(kicker.x, kicker.y, 25); addScreenShake(0.3); }
                        } else if (gameState === 'KICK_DIR') {
                            startKickRunUp(meterValue, dirValue);
                            if (isFieldGoalPlay && Math.abs(dirValue) <= 0.25) { let kicker = players.find(p => p.isKicker); if (kicker) spawnImpactBurst(kicker.x, kicker.y, 25); addScreenShake(0.3); }
                        } else if (['PLAYING', 'BALL_IN_AIR', 'BALL_LOOSE'].includes(gameState) && !player.isBlocking && !player.isDiving && introScriptState !== 'SCRIPTED_RUN') {
                            player.isDiving = true; player.diveTimer = 0;
                            let dx = 0; let dy = 0;
                            if (joystick && joystick.active) {
                                dx = joystick.normX; dy = joystick.normY;
                            } else {
                                if (keys['ArrowUp'] || keys['KeyW']) dy -= 1; if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
                                if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1; if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
                            }

                for (let a = 0; a < 4; a++) { let ang = (a / 4) * Math.PI * 2 + Math.PI / 4; ctx.beginPath(); ctx.moveTo(s.x, cy); ctx.lineTo(s.x + Math.cos(ang) * radius, cy + Math.sin(ang) * radius); ctx.stroke(); }
                ctx.restore();
            });

            let kicker = players.find(p => p.isKicker && !p.isCPU);
            if (kicker && (gameState === 'KICK_POWER' || gameState === 'KICK_DIR')) {
                let kScreen = toScreen(kicker.x, kicker.y);
                if (isFieldGoalPlay) {
                    let pScale = 4; let meterW = 16 * pScale; let meterH = 64 * pScale; let meterX = kScreen.x + 100; let meterY = kScreen.y - meterH / 2;
                    ctx.fillStyle = '#000000'; ctx.fillRect(meterX + pScale * 2, meterY + pScale * 2, meterW, meterH);
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(meterX - pScale, meterY - pScale, meterW + pScale * 2, meterH + pScale * 2);
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(meterX, meterY, meterW, meterH);
                    let numChunks = 16; let chunkH = meterH / numChunks;
                    for (let i = 0; i < numChunks; i++) {
                        let chunkThreshold = (i / numChunks) * 100;
                        if (meterValue > chunkThreshold) {
                            let c = '#4ade80'; if (i >= 8) c = '#facc15'; if (i >= 12) c = '#fb923c'; if (i >= 14) c = (Math.floor(Date.now() / 80) % 2 === 0) ? '#ffffff' : '#ef4444';
                            ctx.fillStyle = c; let cy = meterY + meterH - ((i + 1) * chunkH); ctx.fillRect(meterX + pScale, cy + pScale/2, meterW - pScale*2, chunkH - pScale);
                        }
                    }
                    ctx.font = '24px "Press Start 2P", monospace'; ctx.textAlign = 'center'; let labelText = gameState === 'KICK_POWER' ? "POWER!" : "LOCKED"; let lx = meterX + meterW/2; let ly = meterY - 24;
                    ctx.fillStyle = '#000000'; ctx.fillText(labelText, lx+4, ly+4); ctx.fillStyle = '#ffffff'; ctx.fillText(labelText, lx, ly);
                    let pctText = Math.floor(meterValue) + "%"; let by = meterY + meterH + 36;
                    ctx.fillStyle = '#000000'; ctx.fillText(pctText, lx+4, by+4); ctx.fillStyle = '#ffffff'; ctx.fillText(pctText, lx, by);

                    if (gameState === 'KICK_DIR') {
                        ctx.save(); ctx.translate(kScreen.x, kScreen.y + 10);
                        let baseAngle = (offenseDirection === -1) ? Math.PI : 0; let swingAngle = dirValue * (Math.PI / 2.5); ctx.rotate(baseAngle);
                        let isSweet = Math.abs(dirValue) <= 0.25; ctx.fillStyle = isSweet && (Math.floor(Date.now() / 80) % 2 === 0) ? '#ffffff' : '#22c55e';
                        let rad = 120; let pSize = 6;
                        for(let a = -0.25; a <= 0.25; a += 0.05) { let angle = a * (Math.PI / 2.5); let px = Math.cos(angle)*rad; let py = Math.sin(angle)*rad; ctx.fillRect(px - pSize/2, py - pSize/2, pSize, pSize); }
                        ctx.rotate(swingAngle);
                        ctx.fillStyle = '#000000'; ctx.fillRect(34, -4, 56, 8); ctx.fillRect(94, -12, 8, 24); ctx.fillRect(102, -8, 8, 16); ctx.fillRect(110, -4, 8, 8);
                        ctx.fillStyle = isSweet ? '#facc15' : '#3b82f6'; ctx.fillRect(30, -8, 60, 8); ctx.fillRect(90, -16, 8, 24); ctx.fillRect(98, -12, 8, 16); ctx.fillRect(106, -8, 8, 8);
                        ctx.restore();
                        let ax = kScreen.x; let ay = kScreen.y - 120;
                        ctx.fillStyle = '#000000'; ctx.fillText("ANGLE!", ax+4, ay+4); ctx.fillStyle = '#3b82f6'; ctx.fillText("ANGLE!", ax, ay);
                    }
                } else {
                    let meterX = kScreen.x; let meterY = kScreen.y - 160; let meterW = 240; let meterH = 32;
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(meterX - meterW/2 - 6, meterY - 6, meterW + 12, meterH + 12); ctx.lineWidth = 4; ctx.strokeStyle = '#94a3b8'; ctx.strokeRect(meterX - meterW/2 - 6, meterY - 6, meterW + 12, meterH + 12);
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(meterX - meterW/2, meterY, meterW, meterH);
                    let fillW = (meterValue / 100) * meterW; let barColor = '#22c55e'; if (meterValue > 60) barColor = '#eab308'; if (meterValue > 85) barColor = '#ef4444'; 
                    ctx.fillStyle = barColor; ctx.fillRect(meterX - meterW/2, meterY, fillW, meterH);
                    ctx.fillStyle = '#0f172a'; for(let i = 1; i < 20; i++) ctx.fillRect(meterX - meterW/2 + (i * (meterW/20)) - 1, meterY, 2, meterH);
                    ctx.font = '16px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#ffffff'; ctx.fillText(gameState === 'KICK_POWER' ? "TAP ACTION: POWER" : "TAP ACTION: ANGLE", meterX, meterY - 15);

                    if (gameState === 'KICK_DIR') {
                        ctx.save(); ctx.translate(meterX, meterY + meterH + 20); 
                        let baseAngle = (playState === 'KICK') ? Math.PI : 0; let swingAngle = dirValue * (Math.PI / 3); ctx.rotate(baseAngle + swingAngle);
                        ctx.fillStyle = '#ef4444'; ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff';
                        ctx.beginPath(); ctx.moveTo(90, 0); ctx.lineTo(20, -15); ctx.lineTo(30, 0); ctx.lineTo(20, 15); ctx.closePath(); ctx.fill(); ctx.stroke();
                        ctx.fillStyle = '#eab308'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                        ctx.restore();
                    }
                }
            }

            if (gameState === 'INTERCEPTION_MINIGAME' || gameState === 'INTERCEPTION_RESULT') {
                let dScreen = toScreen(intMinigame.defender.x, intMinigame.defender.y);
                ctx.save(); ctx.fillStyle = 'rgba(0, 0, 0, 0.65)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.lineWidth = intMinigame.tolerance * 2; ctx.strokeStyle = 'rgba(74, 222, 128, 0.5)'; ctx.beginPath(); ctx.arc(dScreen.x, dScreen.y - 40, intMinigame.targetRadius, 0, Math.PI * 2); ctx.stroke();
                ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.beginPath(); ctx.arc(dScreen.x, dScreen.y - 40, intMinigame.targetRadius + intMinigame.tolerance, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.arc(dScreen.x, dScreen.y - 40, intMinigame.targetRadius - intMinigame.tolerance, 0, Math.PI * 2); ctx.stroke();

                if (gameState === 'INTERCEPTION_MINIGAME') {
                    ctx.lineWidth = 4; ctx.strokeStyle = '#facc15'; ctx.beginPath(); ctx.arc(dScreen.x, dScreen.y - 40, intMinigame.ringRadius, 0, Math.PI * 2); ctx.stroke();
                    ctx.font = '16px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#000'; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 3; ctx.fillText("TAP ACT TO INTERCEPT!", dScreen.x, dScreen.y - 120); ctx.shadowColor = 'transparent';
                } else if (gameState === 'INTERCEPTION_RESULT') {
                    ctx.font = '24px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.shadowColor = '#000'; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 4;
                    let scale = 1.0; if (intMinigame.result === 'success') scale = 1.0 + Math.abs(Math.sin(intMinigame.timer * 0.2)) * 0.3;
                    ctx.translate(dScreen.x, dScreen.y - 120); ctx.scale(scale, scale);
                    if (intMinigame.result === 'success') { ctx.fillStyle = '#4ade80'; ctx.fillText("PERFECT!", 0, 0); } 
                    else { ctx.fillStyle = '#ef4444'; let txt = "MISSED!"; if (intMinigame.result === 'fail_early') txt = "TOO EARLY!"; if (intMinigame.result === 'fail_late') txt = "TOO LATE!"; if (intMinigame.result === 'fail_timeout') txt = "TOO SLOW!"; ctx.fillText(txt, 0, 0); }
                }
                ctx.restore();
            }

            if (gameState === 'PLAYING') {
                let cpuCarrier = players.find(p => p.hasBall && p.isCPU);
                if (cpuCarrier) {
                    let cScreen = toScreen(cpuCarrier.x, cpuCarrier.y);
                    let padding = 40; 
                    let isOffScreen = cScreen.x < padding || cScreen.x > canvas.width - padding || cScreen.y < padding || cScreen.y > canvas.height - padding;
                    
                    if (isOffScreen) {
                        let centerX = canvas.width / 2;
                        let centerY = canvas.height / 2;
                        let angle = Math.atan2(cScreen.y - centerY, cScreen.x - centerX);
                        
                        let rectHalfW = canvas.width/2 - padding;
                        let rectHalfH = canvas.height/2 - padding;
                        let dx = Math.cos(angle);
                        let dy = Math.sin(angle);
                        
                        let tX = dx !== 0 ? Math.abs(rectHalfW / dx) : Infinity;
                        let tY = dy !== 0 ? Math.abs(rectHalfH / dy) : Infinity;
                        let t = Math.min(tX, tY);
                        
                        let indX = centerX + dx * t;
                        let indY = centerY + dy * t;

                        ctx.save();
                        ctx.translate(indX, indY);
                        let pulse = 1 + Math.sin(Date.now() / 150) * 0.2;
                        ctx.scale(pulse, pulse);
                        
                        ctx.rotate(angle);
                        ctx.fillStyle = '#ef4444'; // Red CPU color
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 3;
                        
                        // Pointing triangle arrow
                        ctx.beginPath();
                        ctx.moveTo(20, 0);
                        ctx.lineTo(-10, -15);
                        ctx.lineTo(-5, 0);
                        ctx.lineTo(-10, 15);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                        
                        ctx.restore();
                    }
                }
            }
        }

        function resize() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight; ctx.imageSmoothingEnabled = false; 
            camera.baseZoom = canvas.height * 0.045; camera.zoom = camera.baseZoom;
        }

        let lastTime = 0;
        let accumulator = 0;
        const timeStep = 1000 / 60; // 60 updates per second guarantee

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let frameTime = timestamp - lastTime;
            lastTime = timestamp;

            // Prevent spiral of death if the browser tab goes inactive
            if (frameTime > 100) frameTime = 100; 

            accumulator += frameTime;
            while (accumulator >= timeStep) {
                update();
                accumulator -= timeStep;
            }

            drawGame();
            requestAnimationFrame(loop);
        }

        document.fonts.ready.then(function () {
            initTextures(); 
            window.addEventListener('resize', resize); resize(); 
            startIntroSequence();
            requestAnimationFrame(loop);
        });
    </script>
</body>
