<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- CRITICAL META TAGS FOR MOBILE WEB APP EXPERIENCE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Neon Tap">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Generates a simple icon for the home screen -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%230f172a'/><circle cx='256' cy='256' r='144' fill='%2306b6d4'/><circle cx='256' cy='256' r='80' fill='%23f43f5e'/></svg>">
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%230f172a'/><circle cx='256' cy='256' r='144' fill='%2306b6d4'/><circle cx='256' cy='256' r='80' fill='%23f43f5e'/></svg>">

    <title>Neon Tap</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* Base styles to prevent default mobile web behaviors */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Stops scrolling */
            touch-action: none; /* Stops pinch-zoom and double-tap zoom */
            -webkit-user-select: none; /* Stops text selection */
            user-select: none;
            -webkit-touch-callout: none; /* Stops long-press menus on iOS */
            background-color: #0f172a; /* Slate 900 */
            font-family: 'Outfit', sans-serif;
        }

        /* Neon Glow Effects */
        .neon-text {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.7), 0 0 20px rgba(6, 182, 212, 0.5);
        }
        
        .neon-btn {
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .neon-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 5px rgba(244, 63, 94, 0.8);
        }

        /* The Game Target Element */
        #target {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #22d3ee 0%, #06b6d4 50%, #0891b2 100%);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.8), inset 0 0 10px rgba(255,255,255,0.5);
            display: none;
            cursor: pointer;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Ensure fast touch response */
            touch-action: manipulation;
        }

        #target.active {
            transform: translate(-50%, -50%) scale(1);
        }

        /* Tap Particle Effect */
        .particle {
            position: absolute;
            border-radius: 50%;
            background-color: #f43f5e;
            pointer-events: none;
            animation: pop 0.4s ease-out forwards;
        }

        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
        }

        /* UI Overlays */
        .overlay {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="text-white relative bg-slate-900">

    <!-- Heads Up Display (Score & Time) -->
    <div id="hud" class="absolute top-0 left-0 w-full p-6 flex justify-between items-center z-10 pointer-events-none opacity-0 transition-opacity duration-300">
        <div class="flex flex-col">
            <span class="text-slate-400 uppercase text-xs font-bold tracking-widest">Score</span>
            <span id="score" class="text-4xl font-black text-cyan-400 neon-text">0</span>
        </div>
        <div class="flex flex-col text-right">
            <span class="text-slate-400 uppercase text-xs font-bold tracking-widest">Time</span>
            <span id="time" class="text-4xl font-black text-rose-400">30</span>
        </div>
    </div>

    <!-- The actual playable game area -->
    <div id="game-area" class="w-full h-full absolute top-0 left-0">
        <div id="target"></div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay absolute inset-0 flex flex-col items-center justify-center z-20 bg-slate-900/80">
        <div class="w-24 h-24 mb-6 rounded-3xl bg-slate-800 flex items-center justify-center border border-slate-700 shadow-[0_0_30px_rgba(6,182,212,0.2)]">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-cyan-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd" />
            </svg>
        </div>
        <h1 class="text-5xl font-black mb-2 tracking-tight text-white">NEON <span class="text-cyan-400">TAP</span></h1>
        <p class="text-slate-400 mb-10 text-center px-8">Tap the cyan orbs before time runs out. Install via "Add to Home Screen" for the full app experience.</p>
        <button id="start-btn" class="neon-btn bg-rose-500 hover:bg-rose-400 text-white font-bold py-4 px-12 rounded-full text-xl uppercase tracking-wider">
            Play Now
        </button>
    </div>

    <!-- Game Over Screen -->
    <div id="end-screen" class="overlay absolute inset-0 flex flex-col items-center justify-center z-30 bg-slate-900/90 hidden">
        <h2 class="text-3xl font-bold text-slate-300 mb-2 uppercase tracking-widest">Time's Up!</h2>
        <div class="text-7xl font-black text-cyan-400 neon-text mb-2" id="final-score">0</div>
        <p class="text-slate-400 mb-10 font-bold uppercase tracking-wider">Total Orbs Tapped</p>
        <button id="restart-btn" class="neon-btn bg-rose-500 hover:bg-rose-400 text-white font-bold py-4 px-12 rounded-full text-xl uppercase tracking-wider">
            Play Again
        </button>
    </div>

    <script>
        // DOM Elements
        const target = document.getElementById('target');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const startScreen = document.getElementById('start-screen');
        const endScreen = document.getElementById('end-screen');
        const hud = document.getElementById('hud');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreEl = document.getElementById('final-score');
        const gameArea = document.getElementById('game-area');

        // Game State
        let score = 0;
        let timeLeft = 30;
        let isPlaying = false;
        let timerId = null;
        
        // Target properties
        let baseTargetSize = 100;
        let minTargetSize = 40;
        let currentTargetSize = baseTargetSize;

        function moveTarget() {
            if (!isPlaying) return;

            // Get viewport dimensions
            const maxX = window.innerWidth - currentTargetSize;
            const maxY = window.innerHeight - currentTargetSize;
            
            // Account for safe areas (HUD at top)
            const safeTop = 100; 
            const safeBottom = 50;

            // Calculate random position
            const randomX = Math.max(currentTargetSize/2, Math.random() * (window.innerWidth - currentTargetSize));
            const randomY = Math.max(safeTop + currentTargetSize/2, Math.random() * (window.innerHeight - safeTop - safeBottom - currentTargetSize));

            // Apply new position and size
            target.style.width = `${currentTargetSize}px`;
            target.style.height = `${currentTargetSize}px`;
            target.style.left = `${randomX}px`;
            target.style.top = `${randomY}px`;
            
            // Trigger animation
            target.classList.remove('active');
            // Small delay to ensure CSS registers the class removal for the pop-in animation
            setTimeout(() => {
                target.classList.add('active');
            }, 10);
        }

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;
            particle.style.width = `${currentTargetSize}px`;
            particle.style.height = `${currentTargetSize}px`;
            
            gameArea.appendChild(particle);
            
            // Clean up particle DOM element after animation ends
            setTimeout(() => {
                particle.remove();
            }, 400);
        }

        function handleTap(e) {
            if (!isPlaying) return;
            
            // Prevent default behavior (like double tap to zoom)
            e.preventDefault();
            
            // Get exact coordinate whether it's mouse or touch
            let clientX = e.clientX;
            let clientY = e.clientY;
            
            if (e.type.includes('touch') && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            }

            createParticle(clientX, clientY);
            
            score++;
            scoreEl.innerText = score;
            
            // Increase difficulty: Shrink target slightly every 5 points
            if (score % 5 === 0 && currentTargetSize > minTargetSize) {
                currentTargetSize -= 5;
            }

            moveTarget();
        }

        function startGame() {
            // Reset State
            score = 0;
            timeLeft = 30;
            currentTargetSize = baseTargetSize;
            isPlaying = true;
            
            // Update UI
            scoreEl.innerText = score;
            timeEl.innerText = timeLeft;
            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            hud.classList.remove('opacity-0');
            target.style.display = 'block';
            
            moveTarget();

            // Timer Loop
            timerId = setInterval(() => {
                timeLeft--;
                timeEl.innerText = timeLeft;
                
                // Add urgent color when time is low
                if(timeLeft <= 5) {
                    timeEl.classList.remove('text-rose-400');
                    timeEl.classList.add('text-red-500', 'animate-pulse');
                }

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerId);
            
            // Reset urgency styles
            timeEl.classList.add('text-rose-400');
            timeEl.classList.remove('text-red-500', 'animate-pulse');

            target.style.display = 'none';
            hud.classList.add('opacity-0');
            
            finalScoreEl.innerText = score;
            endScreen.classList.remove('hidden');
        }

        
        // Use 'pointerdown' for the target to get the fastest response on mobile and desktop
        target.addEventListener('pointerdown', handleTap);
        
        // UI Buttons
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // PREVENT MOBILE BROWSER BEHAVIORS
        // 1. Prevent "Pull to refresh" on mobile browsers
        document.body.addEventListener('touchmove', function(event) {
            event.preventDefault();
        }, { passive: false });
        
        // 2. Prevent right click / long press context menu
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 3. Fix iOS Safari "bounce" effect
        window.addEventListener('scroll', (e) => {
            e.preventDefault();
            window.scrollTo(0, 0);
        });

    </script>
</body>
</html>
